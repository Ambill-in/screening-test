name: Screening Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tests were not modified
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            git fetch origin main --depth=1 2>/dev/null || git fetch origin master --depth=1
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              BASE="$(git rev-parse origin/main)"
            else
              BASE="$(git rev-parse origin/master)"
            fi
            HEAD="${{ github.sha }}"
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD" -- tests/ src/constants.ts src/lib/receiptType.ts || true)"
          if [ -n "$CHANGED" ]; then
            echo "::error::Protected files must not be modified. This submission is disqualified."
            echo "Changed protected files:"
            echo "$CHANGED"
            exit 1
          fi

          echo "Protected file integrity check passed."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
